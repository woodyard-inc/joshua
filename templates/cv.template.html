<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{PAGE_TITLE}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Joshua Woodyard — Curriculum Vitae. {{TAGLINE_TEXT}}. London.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F0EBDD">
<!-- Generated by scripts/build_cv.py from cv-data.json. Edit the data or the
     template (templates/cv.template.html), not this file. -->
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/CormorantGaramondCV-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/CormorantGaramondCV-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/Helvetica.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/Helvetica-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/NationalCodesUniversal.woff2" crossorigin>
<link rel="stylesheet" href="{{ROOT}}foundations.css">
<style>
  /* ---- CV faces --------------------------------------------------------
     Line metrics are corrected so a line box matches the ink it contains.
     Cormorant Garamond CV is modified at the source by
     scripts/fix_font_metrics.py (SIL OFL, see fonts/OFL.txt). Helvetica and
     National Codes are not ours to modify, so the same correction is made
     here with *-override descriptors, using that script's measurements. */
  @font-face { font-family: "Cormorant Garamond CV"; src: url("{{ROOT}}fonts/CormorantGaramondCV-Regular.woff2") format("woff2");
               font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Cormorant Garamond CV"; src: url("{{ROOT}}fonts/CormorantGaramondCV-Bold.woff2") format("woff2");
               font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Cormorant Garamond CV"; src: url("{{ROOT}}fonts/CormorantGaramondCV-LightItalic.woff2") format("woff2");
               font-weight: 300 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Helvetica CV"; src: url("{{ROOT}}fonts/Helvetica.woff2") format("woff2");
               font-weight: 400; font-display: swap;
               ascent-override: 73.7%; descent-override: 22.1%; line-gap-override: 0%; }
  @font-face { font-family: "Helvetica CV"; src: url("{{ROOT}}fonts/Helvetica-Bold.woff2") format("woff2");
               font-weight: 700; font-display: swap;
               ascent-override: 74.3%; descent-override: 21.8%; line-gap-override: 0%; }
  @font-face { font-family: "National CV"; src: url("{{ROOT}}fonts/NationalCodesUniversal.woff2") format("woff2");
               font-weight: 700; font-display: swap;
               unicode-range: U+0020, U+0041-005A, U+0061-007A, U+00A0;
               ascent-override: 29.6%; descent-override: 3.6%; line-gap-override: 0%; }

  :root {
    --font-body:     "Cormorant Garamond CV", Georgia, serif;
    --font-sans:     "Helvetica CV", Arial, sans-serif;
    --font-wordmark: "National CV", "Helvetica CV", Arial, sans-serif;

    /* Spacing. Every gap on the page is one of these; nothing is nudged by
       a one-off margin. Headings, titles and meta lines are trimmed to their
       cap height and baseline (text-box), so a token is the distance from
       ink to ink, not from one invisible line box to another.

       Each value is a whole CSS pixel (1px = 0.75pt). Chrome snaps painted
       rules to the pixel grid but sets text at fractional positions, so any
       fractional height above a section rule moves that rule against the text
       below it by up to 0.75pt. Keeping every block a whole number of pixels
       keeps each rule-to-text gap identical. Hence 9.75pt and 15.75pt rather
       than 10pt and 16pt, which are 13.33px and 21.33px. */
    --space-2xs: 1.5pt;    /*  2px */
    --space-xs:  3pt;      /*  4px */
    --space-s:   6pt;      /*  8px */
    --space-m:   9.75pt;   /* 13px */
    --space-l:   15.75pt;  /* 21px */

    /* Leading. Unitless, never "normal". The body value (cv-data.json,
       _layout.lineHeight) is 1.305: exactly 20px at 11.5pt on screen and in
       print. Chrome truncates line heights to 1/64px and, when printing,
       stores 11.5pt a hair under 15.333px, so 1.3 or even 1.30435 comes out
       at 19.984px and the 0.016px lost on every line drifts each rule off
       the text below it. */
    --lh-body:   {{LH_BODY}};
    --lh-single: 1.2;
  }

  body { background: var(--paper-warm); padding: var(--s-7) 0; }

  .page {
    width: 210mm; min-height: 297mm;
    margin: 0 auto var(--s-6);
    background: var(--paper);
    padding: 12mm 14mm;
    box-shadow: 0 8px 40px -16px #14141433;
    font-variant-ligatures: none;   /* ligature glyphs can extract as garbage */
    position: relative;
  }

  /* Text that should sit exactly on its ink: top at cap height, bottom on
     the baseline. Applied to every single-line structural element. */
  .trim { text-box: trim-both cap alphabetic; }
  /* A trimmed single line is exactly one cap height tall, which is rarely a
     whole pixel; round it up so nothing below it starts on a fractional y. */
  .trim-line { box-sizing: content-box; block-size: round(up, 1cap, 1px); }
  /* The same for a trimmed block of several lines: with a whole-pixel line
     height, (lines - 1) x leading + cap is whole once the cap is rounded up.
     The extra 1/64px offsets Chrome truncating the cap to its layout unit. */
  .trim-block { box-sizing: content-box; padding-bottom: calc(round(up, 1cap, 1px) - 1cap + 1px / 64); }

  /* ---- Masthead (page 1) ------------------------------------------------ */
  .cv-masthead { position: relative; margin: 0 0 var(--space-m); }
  .cv-tagline {
    font-family: var(--font-sans); font-weight: 700;
    font-size: var(--cv-micro); line-height: var(--lh-single);
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--cobalt); margin: 0;
    max-width: none;
  }
  .cv-tagline .sep, .cv-contact .sep, .cv-stamp .sep, .entry-title .sep, .entry-meta .sep {
    color: var(--ink-muted); font-weight: 400;
  }
  /* Not ".cv-name": foundations.css forces negative tracking on that class. */
  .cv-fullname {
    font-family: var(--font-wordmark); font-weight: 700;
    font-size: var(--cv-name); line-height: 1;
    text-transform: lowercase;   /* National's lowercase forms are the mark */
    letter-spacing: normal; color: var(--ink);
    margin: var(--space-m) 0 0;
  }
  .cv-contact {
    font-family: var(--font-sans); font-weight: 400;
    font-size: var(--cv-micro); line-height: var(--lh-single);
    letter-spacing: 0.02em; color: var(--ink);
    margin: var(--space-m) 0 0;
    padding-bottom: var(--space-s);
    border-bottom: 1px solid var(--ink);
    max-width: none;
  }
  .cv-contact a { color: var(--ink); border: none; }
  /* Date stamp and page marker. In the source it follows the contact line so
     a parser never reads it in the middle of the contact details; it is
     placed top-right visually. */
  .cv-stamp {
    position: absolute; top: 0; right: 0; margin: 0;
    font-family: var(--font-sans); font-weight: 700;
    font-size: var(--cv-micro); line-height: var(--lh-single);
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-muted);
    max-width: none;
  }

  /* ---- Running header (page 2): no rule under it ------------------------ */
  .cv-runhead { position: relative; margin: 0 0 var(--space-l); }
  .cv-runmark {
    font-family: var(--font-wordmark); font-weight: 700;
    font-size: var(--cv-name); line-height: 1;
    text-transform: lowercase; letter-spacing: normal;
    color: var(--ink); margin: 0;
  }
  .cv-runhead .cv-stamp { top: 50%; transform: translateY(-50%); }

  /* ---- Profile ----------------------------------------------------------- */
  .cv-lede {
    font-family: var(--font-body); font-weight: 400;
    font-size: var(--cv-body); line-height: var(--lh-body);
    color: var(--ink); margin: 0;
    max-width: none; text-wrap: pretty;
  }

  /* ---- Sections ---------------------------------------------------------- */
  .cv-section { margin-top: var(--space-l); }
  .cv-section > h2 {
    font-family: var(--font-sans); font-weight: 700;
    font-size: var(--cv-heading); line-height: var(--lh-single);
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink);
    margin: 0 0 var(--space-s);
    padding-bottom: var(--space-xs);
    /* The rule is painted as a gradient rather than a border. Chrome snaps
       borders to whole pixels but sets text at fractional positions, so a
       border rule lands up to 1px (0.75pt) off depending on where the section
       happens to start. A painted line is drawn exactly where it is placed. */
    background: linear-gradient(var(--ink), var(--ink)) left bottom / 100% 1.1pt no-repeat;
  }

  /* ---- Entries: roles, research, education ------------------------------ */
  .entry + .entry { margin-top: var(--space-m); }
  .entry-title {
    font-family: var(--font-sans); font-weight: 700;
    font-size: var(--cv-entry); line-height: var(--lh-single);
    letter-spacing: -0.005em; color: var(--ink);
    margin: 0; max-width: none;
  }
  .entry-meta {
    font-family: var(--font-body); font-weight: 400;
    font-size: var(--cv-body); line-height: var(--lh-single);
    color: var(--ink-soft);
    margin: var(--space-xs) 0 0; max-width: none;
  }

  .cv-bullets {
    list-style: none; padding: 0; margin: var(--space-xs) 0 0;
  }
  .cv-bullets li {
    font-family: var(--font-body); font-weight: 400;
    font-size: var(--cv-body); line-height: var(--lh-body);
    color: var(--ink);
    padding-left: 1.1em; position: relative;
    margin: 0 0 var(--space-2xs);
    max-width: none; text-wrap: unset;
  }
  .cv-bullets li:last-child { margin-bottom: 0; }
  .cv-bullets li::before {
    content: "\2022";
    position: absolute; left: 0.15em; top: 0;
    font-family: var(--font-body); font-weight: 700;
    line-height: var(--lh-body);
    color: var(--cobalt);
  }
  .cv-bullets li strong { font-weight: 700; color: var(--cobalt); }
  .edu-bullets li::before { color: var(--ink); }
  .cv-bullets li.topics {
    padding-left: 0; color: var(--ink-soft); font-style: italic;
    margin-top: var(--space-xs);
  }
  .cv-bullets li.topics::before { content: none; }
  .cv-bullets li.topics b {
    font-family: var(--font-sans); font-weight: 700; font-style: normal;
    font-size: var(--cv-micro); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft); margin-right: var(--space-s);
  }

  /* ---- Skills & Languages ------------------------------------------------ */
  /* Label and value are both trimmed to cap height and baseline, so the
     padding is measured from ink: rule to cap is --space-xs; baseline to
     rule is 6px, which clears the deepest descender (0.283em, 4.3px). The
     label column is wide enough that no label wraps. */
  .skill-row {
    display: grid; grid-template-columns: 37mm 1fr; column-gap: var(--space-m);
    align-items: start;
    padding: var(--space-xs) 0 calc(var(--space-xs) + var(--space-2xs));
    border-bottom: 1px solid var(--rule);
  }
  .skill-row:first-of-type { padding-top: 0; }
  .skill-row:last-child { border-bottom: none; padding-bottom: 0; }
  .skill-row .k {
    font-family: var(--font-sans); font-weight: 700;
    font-size: var(--cv-micro); line-height: var(--lh-single);
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0;
  }
  .skill-row .v {
    font-family: var(--font-body); font-weight: 400;
    font-size: var(--cv-body); line-height: var(--lh-body);
    color: var(--ink); margin: 0; max-width: none;
  }

  /* Hyphenated tokens stay on one line: extractors drop a hyphen a line
     break lands on ("MRI-Simmons" -> "MRISimmons"). */
  .nb { white-space: nowrap; }

  /* ---- Screen chrome ----------------------------------------------------- */
  .back-link {
    display: block; max-width: 210mm; margin: 0 auto var(--s-4);
    font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-muted); border: none; padding: 0;
  }
  .back-link:hover { color: var(--ink); }

  .lock-tab {
    position: fixed; right: 0; bottom: 0; z-index: 40;
    background: var(--ink); color: var(--paper); border: none; cursor: pointer;
    padding: 10px 14px;
    font-family: var(--font-display); font-weight: 700;
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  body[data-unlocked="yes"] .lock-tab { display: none; }
  .lock-form {
    position: fixed; right: 0; bottom: 0; z-index: 41;
    background: var(--ink); padding: 12px 14px;
    display: none; gap: 6px; align-items: center;
  }
  body[data-locking="yes"] .lock-form { display: flex; }
  body[data-locking="yes"] .lock-tab { display: none; }
  .lock-form input {
    background: transparent; border: 1px solid rgba(250,247,240,0.35);
    color: var(--paper); padding: 6px 8px; font-size: 11px; width: 130px;
  }
  .lock-form button {
    background: none; border: 1px solid rgba(250,247,240,0.35); color: var(--paper);
    padding: 6px 10px; cursor: pointer;
    font-family: var(--font-display); font-weight: 700;
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .lock-form .err { color: #ff9a8a; font-size: 10px; }

  .save-panel {
    position: fixed; bottom: 24px; right: 24px; z-index: 50;
    background: var(--ink); color: var(--paper);
    padding: 14px 18px;
    font-family: var(--font-display); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
    box-shadow: 0 8px 32px -8px #14141466;
  }
  body:not([data-unlocked="yes"]) .save-panel { display: none; }
  .save-panel .sp-label { color: rgba(250,247,240,0.5); }
  .save-panel .sp-row { display: flex; gap: 6px; width: 100%; }
  .save-panel button, .save-panel a.sp-link {
    font-family: var(--font-display); font-weight: 700; font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding: 8px 12px; border: 1px solid rgba(250,247,240,0.4);
    background: transparent; color: var(--paper); cursor: pointer;
    flex: 1; text-align: center; box-sizing: border-box;
  }
  .save-panel a.sp-link { display: block; width: 100%; }
  .save-panel button:hover, .save-panel a.sp-link:hover { background: rgba(250,247,240,0.1); }
  .save-panel button.active { background: rgba(250,247,240,0.15); border-color: var(--paper); }

  /* Greyscale swaps colour values rather than filtering: print engines drop
     CSS filters. The warm inks are neutralised too, or they read as parchment. */
  body[data-colour="grey"] {
    --cobalt:     var(--ink);
    --ink-soft:   #3A3A3A;
    --ink-muted:  #878787;
  }

  /* ---- Print: A4 --------------------------------------------------------
     The margin lives in @page, with almost no page padding behind it, so a
     browser printing with its own "Default" margins lands on ours rather than
     stacking a second margin on top. */
  @media print {
    .back-link, .save-panel, .lock-tab, .lock-form { display: none !important; }
    body { background: var(--paper); padding: 0; }
    .page { box-shadow: none; margin: 0; width: 100%; min-height: auto; padding: 4px 2px; }
    .page:not(:last-of-type) { break-after: page; }
    @page { size: A4; margin: 31.5pt 36.75pt; }   /* 42px x 49px, ~11mm x 13mm */
  }

  @media screen and (max-width: 210mm) {
    body { padding: var(--s-5) 0; }
    .page { width: 100%; padding: var(--s-6) var(--s-5); min-height: auto; box-shadow: none; }
    .skill-row { grid-template-columns: 1fr; row-gap: var(--space-xs); }
    .cv-stamp { position: static; margin-top: var(--space-s); transform: none; }
  }

  @media screen and (max-width: 600px) {
    body { padding: 0; }
    .back-link { padding: var(--s-4) var(--s-5); margin: 0; }
    .page { padding: var(--s-5) var(--s-4); margin-bottom: var(--s-5); }
    .cv-fullname, .cv-runmark { font-size: 26px; }
    .save-panel {
      bottom: 0; right: 0; left: 0;
      flex-direction: row; align-items: center; justify-content: space-between;
      padding: 10px 14px; gap: 8px;
    }
    .save-panel .sp-label { display: none; }
    .save-panel .sp-row { width: auto; }
  }
</style>
</head>
<body>

<a class="back-link" href="{{ROOT}}index.html">← Back to portfolio</a>

<!-- PAGE 1 -->
<article class="page">
  <header class="cv-masthead">
    <p class="cv-tagline trim trim-line">{{TAGLINE}}</p>
    <h1 class="cv-fullname trim trim-line">Joshua Woodyard</h1>
    <p class="cv-contact trim trim-line">{{CONTACT}}</p>
    <p class="cv-stamp trim">{{STAMP_1}}</p>
  </header>

  <p class="cv-lede">{{PROFILE}}</p>

{{PAGE1_SECTIONS}}
</article>

<!-- PAGE 2 -->
<article class="page">
  <header class="cv-runhead">
    <p class="cv-runmark trim trim-line">Joshua Woodyard</p>
    <p class="cv-stamp trim">{{STAMP_2}}</p>
  </header>

{{PAGE2_SECTIONS}}
</article>

<button class="lock-tab" onclick="openLock()">Tools</button>
<form class="lock-form" onsubmit="return unlock(event)">
  <input type="password" id="lock-pw" placeholder="Password" autocomplete="off">
  <button type="submit">Unlock</button>
  <span class="err" id="lock-err"></span>
</form>

<div class="save-panel">
  <span class="sp-label">Joshua Woodyard · CV · {{VARIANT_LABEL}}</span>
  <div class="sp-row">
    <button class="active" id="btn-colour" onclick="setColour('colour')">Colour</button>
    <button id="btn-grey" onclick="setColour('grey')">Greyscale</button>
  </div>
  <button onclick="window.print()">Save as PDF →</button>
  <a class="sp-link" href="{{ATS_HREF}}">ATS version →</a>
{{VARIANT_LINKS}}
  <a class="sp-link" href="{{ROOT}}tailor.html">CV Workshop →</a>
  <span class="sp-label" style="margin-top:2px;">Full contact details are in the Workshop</span>
</div>
<script>
  const WORKER_URL = "https://joshua-cv-tailor.woodyardjoshuae.workers.dev";

  function openLock() {
    document.body.dataset.locking = 'yes';
    document.getElementById('lock-pw').focus();
  }

  async function unlock(e) {
    e.preventDefault();
    const pw = document.getElementById('lock-pw').value;
    const err = document.getElementById('lock-err');
    err.textContent = '';
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw, action: 'verify' }),
      });
      if (!res.ok) { err.textContent = 'No'; return false; }
      sessionStorage.setItem('cv-tailor-pw', pw);
      document.body.dataset.unlocked = 'yes';
      document.body.dataset.locking = '';
    } catch {
      err.textContent = 'Offline';
    }
    return false;
  }

  if (sessionStorage.getItem('cv-tailor-pw')) document.body.dataset.unlocked = 'yes';

  function setColour(mode) {
    document.body.dataset.colour = mode;
    document.getElementById('btn-colour').classList.toggle('active', mode === 'colour');
    document.getElementById('btn-grey').classList.toggle('active', mode === 'grey');
  }
</script>

</body>
</html>
