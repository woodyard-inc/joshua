<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Joshua Woodyard CV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  /* ATS variant. Deliberately plain: no custom webfonts (their ToUnicode
     tables are where ligatures get mangled on extraction), no grid, no flex,
     no tables, no absolutely positioned bullet glyphs. Everything is ordinary
     block flow so a parser reads it in the order it is written. The designed
     CV at cv.html is untouched and remains the one to look at. */
  @page { size: A4; margin: 12mm 14mm; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt;
    line-height: 1.3;
    color: #000;
    background: #fff;
    margin: 0 auto;
    padding: 12mm 14mm;
    max-width: 182mm;
    /* No justification and no hyphenation: both can split words across lines
       in ways that survive into the extracted text. */
    text-align: left;
    hyphens: none;
    -webkit-hyphens: none;
    font-variant-ligatures: none;
  }

  h1 {
    font-size: 15pt;
    font-weight: bold;
    letter-spacing: normal;
    text-transform: none;
    margin: 0 0 4pt;
  }

  h2 {
    font-size: 11.5pt;
    font-weight: bold;
    letter-spacing: normal;
    text-transform: none;
    margin: 11pt 0 4pt;
    border-bottom: 1px solid #000;
    padding-bottom: 2pt;
  }

  p { margin: 0 0 6pt; }

  .tagline { margin: 0 0 2pt; }
  .contact { margin: 0 0 4pt; }

  /* Role header: two plain lines, then the list, with nothing between them. */
  .role { margin-top: 8pt; }
  .role-title { font-weight: bold; margin: 0; }
  .role-meta  { margin: 0 0 3pt; }

  ul { margin: 0 0 6pt; padding-left: 16pt; }
  li { margin: 0 0 2pt; }

  /* A role may run across a page break, but its title and dates always stay
     with its first bullet, and no bullet is split. Holding whole roles
     together left most of a page empty when one didn't fit. */
  .role-title, .role-meta, h2 { break-after: avoid; page-break-after: avoid; }
  li { break-inside: avoid; page-break-inside: avoid; }
  .edu { break-inside: avoid; page-break-inside: avoid; }

  /* A line broken at an existing hyphen ("MRI-Simmons") is rejoined by text
     extractors without the hyphen, producing "MRISimmons". Hyphenated tokens
     are therefore held together on one line. */
  .nb { white-space: nowrap; }

  .loading { color: #666; }

  @media print {
    body { padding: 0; max-width: none; }
    .screen-note { display: none; }
  }

  .screen-note {
    margin: 0 0 18pt;
    padding: 8pt 10pt;
    border: 1px solid #999;
    font-size: 9pt;
    color: #444;
  }
</style>
</head>
<body>

<div class="screen-note">
  ATS variant &mdash; plain single-column rendering of the same master data
  (<code>cv-data.json</code>), sized for A4. Print to PDF for submission. The
  designed CV is at <a href="cv.html">cv.html</a>. This note does not print.
</div>

<div id="cv"><p class="loading">Loading&hellip;</p></div>

<script>
(function () {
  // Same master data as the designed CV. ?variant=consumer-insights swaps the
  // tagline and the Skills row order and nothing else.
  var params = new URLSearchParams(location.search);
  var VARIANT = params.get('variant') || 'master';

  function setText(node, text) {
    var esc = String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    node.innerHTML = esc.replace(/\S*\w-\w\S*/g, function (m) {
      return '<span class="nb">' + m + '</span>';
    });
  }
  function el(tag, text, cls) {
    var n = document.createElement(tag);
    if (text != null) setText(n, text);
    if (cls) n.className = cls;
    return n;
  }
  function list(items) {
    var ul = document.createElement('ul');
    items.forEach(function (t) { ul.appendChild(el('li', t)); });
    return ul;
  }
  function section(root, heading) { root.appendChild(el('h2', heading)); }

  // Cuts apply per document, and only to one that runs over. The ATS export
  // holds two pages without any, so it keeps every bullet; the designed CV's
  // cuts live in _layout.omit and are not applied here.
  function omitted(cv) { return ((cv._layout || {}).atsOmit) || []; }
  function keepRole(b, omit) { return omit.indexOf(b.id) === -1; }
  function keepResearch(text, omit) {
    return !omit.some(function (o) {
      return o.indexOf('research:') === 0 && text.indexOf(o.slice(9)) === 0;
    });
  }

  function render(cv) {
    var v = (cv.variants || {})[VARIANT] || cv.variants.master;
    var omit = omitted(cv);
    var c = cv.contact || {};
    var root = document.getElementById('cv');
    root.innerHTML = '';

    root.appendChild(el('h1', 'Joshua Woodyard'));
    root.appendChild(el('p', v.tagline, 'tagline'));
    root.appendChild(el('p', [c.location, c.email, c.phone, c.linkedin].filter(Boolean).join(' | '), 'contact'));

    section(root, 'Profile');
    root.appendChild(el('p', cv.summaries.master));

    section(root, 'Experience');
    (cv.roles || []).forEach(function (r) {
      var block = el('div', null, 'role');
      block.appendChild(el('p', r.title + ' | ' + r.company, 'role-title'));
      block.appendChild(el('p', r.where + ' | ' + r.when, 'role-meta'));
      block.appendChild(list(r.bullets.filter(function (b) { return keepRole(b, omit); })
                                      .map(function (b) { return b.text; })));
      root.appendChild(block);
    });

    section(root, 'Research');
    var d = cv.dissertation;
    var rb = el('div', null, 'role');
    rb.appendChild(el('p', d.title, 'role-title'));
    rb.appendChild(el('p', [d.institution, d.year, d.mark].join(' | '), 'role-meta'));
    // Every CV carries the condensed research bullets; the full set is for
    // research roles, chosen in the Workshop.
    rb.appendChild(list((d.short || d.bullets).filter(function (t) { return keepResearch(t, omit); })));
    root.appendChild(rb);

    // The short, one-bullet project entry carried on every CV.
    var pj = cv.project;
    if (pj && pj.short) {
      section(root, 'Projects');
      var pb = el('div', null, 'role');
      pb.appendChild(el('p', pj.title, 'role-title'));
      pb.appendChild(el('p', [pj.label, pj.year].join(' | '), 'role-meta'));
      pb.appendChild(list([].concat(pj.short)));
      root.appendChild(pb);
    }

    section(root, 'Education');
    (cv.education || []).forEach(function (e) {
      var block = el('div', null, 'edu');
      block.appendChild(el('p', e.degree, 'role-title'));
      block.appendChild(el('p', e.school + ' | ' + e.when, 'role-meta'));
      var items = (e.meta || []).slice();
      if (e.topics) items.push('Topics: ' + e.topics);
      if (items.length) block.appendChild(list(items));
      root.appendChild(block);
    });

    section(root, 'Skills & Languages');
    var byId = {};
    (cv.skills || []).forEach(function (s) { byId[s.id] = s; });
    root.appendChild(list(v.skillOrder.map(function (id) {
      if (id === 'languages') {
        return 'Languages: ' + (cv.languages || []).map(function (l) {
          return l.name + ' (' + l.level + ')';
        }).join(', ');
      }
      return byId[id].label + ': ' + byId[id].text;
    })));

    document.title = 'Joshua Woodyard CV' + (VARIANT === 'master' ? '' : ' - ' + v.label);
  }

  fetch('cv-data.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      document.getElementById('cv').innerHTML =
        '<p class="loading">Could not load cv-data.json (' + err.message +
        '). Serve this page over http:// rather than opening the file directly.</p>';
    });
})();
</script>
</body>
</html>
