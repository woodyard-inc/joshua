<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{PAGE_TITLE}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Joshua Woodyard — Curriculum Vitae. {{TAGLINE_TEXT}}. London.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F0EBDD">
<!-- Generated by scripts/build_cv.py from cv-data.json. Edit the data or the
     template (templates/cv.template.html), not this file. -->
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/CormorantGaramondCV-Regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/CormorantGaramondCV-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/Helvetica.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/Helvetica-Bold.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ROOT}}fonts/NationalCodesUniversal.woff2" crossorigin>
<link rel="stylesheet" href="{{ROOT}}foundations.css">
<link rel="stylesheet" href="{{ROOT}}cv.css">
<style>
  /* CV type and layout live in cv.css, shared with the CV Workshop. This
     block is only this page's own chrome. */
  body { background: var(--paper-warm); padding: var(--s-7) 0; }

  /* ---- Screen chrome ----------------------------------------------------- */
  .back-link {
    display: block; max-width: 210mm; margin: 0 auto var(--s-4);
    font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-muted); border: none; padding: 0;
  }
  .back-link:hover { color: var(--ink); }

  .lock-tab {
    position: fixed; right: 0; bottom: 0; z-index: 40;
    background: var(--ink); color: var(--paper); border: none; cursor: pointer;
    padding: 10px 14px;
    font-family: var(--font-display); font-weight: 700;
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  body[data-unlocked="yes"] .lock-tab { display: none; }
  .lock-form {
    position: fixed; right: 0; bottom: 0; z-index: 41;
    background: var(--ink); padding: 12px 14px;
    display: none; gap: 6px; align-items: center;
  }
  body[data-locking="yes"] .lock-form { display: flex; }
  body[data-locking="yes"] .lock-tab { display: none; }
  .lock-form input {
    background: transparent; border: 1px solid rgba(250,247,240,0.35);
    color: var(--paper); padding: 6px 8px; font-size: 11px; width: 130px;
  }
  .lock-form button {
    background: none; border: 1px solid rgba(250,247,240,0.35); color: var(--paper);
    padding: 6px 10px; cursor: pointer;
    font-family: var(--font-display); font-weight: 700;
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .lock-form .err { color: #ff9a8a; font-size: 10px; }

  .save-panel {
    position: fixed; bottom: 24px; right: 24px; z-index: 50;
    background: var(--ink); color: var(--paper);
    padding: 14px 18px;
    font-family: var(--font-display); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
    box-shadow: 0 8px 32px -8px #14141466;
  }
  body:not([data-unlocked="yes"]) .save-panel { display: none; }
  .save-panel .sp-label { color: rgba(250,247,240,0.5); }
  .save-panel .sp-row { display: flex; gap: 6px; width: 100%; }
  .save-panel button, .save-panel a.sp-link {
    font-family: var(--font-display); font-weight: 700; font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding: 8px 12px; border: 1px solid rgba(250,247,240,0.4);
    background: transparent; color: var(--paper); cursor: pointer;
    flex: 1; text-align: center; box-sizing: border-box;
  }
  .save-panel a.sp-link { display: block; width: 100%; }
  .save-panel button:hover, .save-panel a.sp-link:hover { background: rgba(250,247,240,0.1); }
  .save-panel button.active { background: rgba(250,247,240,0.15); border-color: var(--paper); }

  @media print {
    .back-link, .save-panel, .lock-tab, .lock-form { display: none !important; }
    body { background: #fff; padding: 0; }
  }
  @media screen and (max-width: 210mm) {
    body { padding: var(--s-5) 0; }
  }
  @media screen and (max-width: 600px) {
    body { padding: 0; }
    .back-link { padding: var(--s-4) var(--s-5); margin: 0; }
    .save-panel {
      bottom: 0; right: 0; left: 0;
      flex-direction: row; align-items: center; justify-content: space-between;
      padding: 10px 14px; gap: 8px;
    }
    .save-panel .sp-label { display: none; }
    .save-panel .sp-row { width: auto; }
  }
</style>
</head>
<body>

<a class="back-link" href="{{ROOT}}index.html">← Back to portfolio</a>

<!-- PAGE 1 -->
<article class="page">
  <header class="cv-masthead">
    <p class="cv-tagline trim trim-line">{{TAGLINE}}</p>
    <h1 class="cv-fullname trim trim-line">Joshua Woodyard</h1>
    <p class="cv-contact trim trim-line">{{CONTACT}}</p>
    <p class="cv-stamp trim">{{STAMP_1}}</p>
  </header>

  <p class="cv-lede">{{PROFILE}}</p>

{{PAGE1_SECTIONS}}
</article>

<!-- PAGE 2 -->
<article class="page">
{{PAGE2_SECTIONS}}

  <!-- Page number only, at the foot and outside the flow: a name or date at
       the top of page 2 was read as part of the last role on page 1. -->
  <p class="cv-pagefoot trim">2 / 2</p>
</article>

<button class="lock-tab" onclick="openLock()">Tools</button>
<form class="lock-form" onsubmit="return unlock(event)">
  <input type="password" id="lock-pw" placeholder="Password" autocomplete="off">
  <button type="submit">Unlock</button>
  <span class="err" id="lock-err"></span>
</form>

<div class="save-panel">
  <span class="sp-label">Joshua Woodyard · CV · {{VARIANT_LABEL}}</span>
  <div class="sp-row">
    <button class="active" id="btn-colour" onclick="setColour('colour')">Colour</button>
    <button id="btn-grey" onclick="setColour('grey')">Greyscale</button>
  </div>
  <button onclick="window.print()">Save as PDF →</button>
  <a class="sp-link" href="{{ATS_HREF}}">ATS version →</a>
  <a class="sp-link" href="{{ROOT}}tailor.html">CV Workshop →</a>
  <span class="sp-label" style="margin-top:2px;">Full contact details are in the Workshop</span>
</div>
<script>
  const WORKER_URL = "https://joshua-cv-tailor.woodyardjoshuae.workers.dev";

  function openLock() {
    document.body.dataset.locking = 'yes';
    document.getElementById('lock-pw').focus();
  }

  async function unlock(e) {
    e.preventDefault();
    const pw = document.getElementById('lock-pw').value;
    const err = document.getElementById('lock-err');
    err.textContent = '';
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw, action: 'verify' }),
      });
      if (!res.ok) { err.textContent = 'No'; return false; }
      sessionStorage.setItem('cv-tailor-pw', pw);
      document.body.dataset.unlocked = 'yes';
      document.body.dataset.locking = '';
    } catch {
      err.textContent = 'Offline';
    }
    return false;
  }

  if (sessionStorage.getItem('cv-tailor-pw')) document.body.dataset.unlocked = 'yes';

  function setColour(mode) {
    document.body.dataset.colour = mode;
    document.getElementById('btn-colour').classList.toggle('active', mode === 'colour');
    document.getElementById('btn-grey').classList.toggle('active', mode === 'grey');
  }
</script>

</body>
</html>
